<section class="flex min-h-screen items-center justify-center bg-bg px-6 py-10 text-tx" style="background:radial-gradient(1200px 600px at 70% -10%, rgba(167,139,250,0.10), transparent 60%), #0c0c0f">
  <div class="w-full max-w-[400px]">
    <div class="mb-8 flex items-center justify-center gap-3">
      <div class="flex h-[38px] w-[38px] items-center justify-center rounded-xl bg-gradient-to-br from-accent2 to-accentstrong shadow-[0_6px_18px_-4px_#8b5cf6]">
        <span class="material-symbols-outlined text-[23px] text-[#0f0f13]">savings</span>
      </div>
      <span class="text-xl font-bold tracking-tight">Finanças</span>
    </div>

    <div class="rounded-[20px] border border-bd bg-card p-8 shadow-cardlg">
      <h1 class="text-[21px] font-bold tracking-tight">
        {{ modo() === 'login' ? 'Bem-vindo de volta' : 'Crie sua conta' }}
      </h1>
      <p class="mb-6 mt-1 text-[13px] text-mut">
        {{ modo() === 'login' ? 'Entre para ver sua projeção de saldo' : 'Comece a acompanhar suas finanças hoje' }}
      </p>

      <div *ngIf="modo() === 'register'">
        <label class="mb-1.5 block text-xs font-semibold text-tx2">Nome completo</label>
        <div class="mb-4 flex h-11 items-center gap-2.5 rounded-[11px] border border-bd bg-card2 px-3.5">
          <span class="material-symbols-outlined text-[19px] text-dim">person</span>
          <input
            class="w-full border-0 bg-transparent text-sm text-tx outline-none"
            [value]="nome()"
            (input)="nome.set($any($event.target).value)"
            placeholder="Seu nome"
          />
        </div>
      </div>

      <label class="mb-1.5 block text-xs font-semibold text-tx2">E-mail</label>
      <div class="mb-4 flex h-11 items-center gap-2.5 rounded-[11px] border border-bd bg-card2 px-3.5">
        <span class="material-symbols-outlined text-[19px] text-dim">mail</span>
        <input
          class="w-full border-0 bg-transparent text-sm text-tx outline-none"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          (keyup.enter)="enviar()"
          placeholder="voce@exemplo.com"
          type="email"
        />
      </div>

      <label class="mb-1.5 block text-xs font-semibold text-tx2">Senha</label>
      <div class="mb-5 flex h-11 items-center gap-2.5 rounded-[11px] border border-bd bg-card2 px-3.5">
        <span class="material-symbols-outlined text-[19px] text-dim">lock</span>
        <input
          class="w-full border-0 bg-transparent text-sm text-tx outline-none"
          [value]="senha()"
          (input)="senha.set($any($event.target).value)"
          (keyup.enter)="enviar()"
          placeholder="Mínimo de 8 caracteres"
          type="password"
        />
      </div>

      <p *ngIf="erro()" class="mb-4 rounded-xl border border-neg/30 bg-neg/[0.12] px-4 py-2.5 text-sm font-medium text-neg">
        {{ erro() }}
      </p>

      <button
        class="h-[46px] w-full rounded-xl bg-gradient-to-br from-accent2 to-accentstrong text-sm font-bold text-[#0f0f13] shadow-[0_6px_18px_-6px_#8b5cf6] transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="carregando()"
        (click)="enviar()"
      >
        {{ carregando() ? 'Processando...' : modo() === 'login' ? 'Entrar' : 'Criar conta e entrar' }}
      </button>

      <div class="my-[18px] flex items-center gap-3 text-[11px] text-dim">
        <span class="h-px flex-1 bg-bd"></span>ou<span class="h-px flex-1 bg-bd"></span>
      </div>

      <button
        class="flex h-11 w-full items-center justify-center gap-2.5 rounded-xl border border-bd bg-card2 text-[13px] font-semibold text-tx transition hover:border-accent/40"
        (click)="alternarModo(modo() === 'login' ? 'register' : 'login')"
      >
        {{ modo() === 'login' ? 'Criar uma conta nova' : 'Já tenho conta' }}
      </button>
    </div>
  </div>
</section>
