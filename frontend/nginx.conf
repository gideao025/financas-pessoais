server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API: proxy para o backend no mesmo domínio (evita CORS e host/porta fixos).
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authorization e demais headers são repassados por padrão.
  }

  # Health do backend, opcional (útil para checagens externas).
  location /actuator/ {
    proxy_pass http://backend:8080/actuator/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
