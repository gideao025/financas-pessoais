spring:
  application:
    name: financas-pessoais-backend

  profiles:
    # dev por padrão (local zero-config). Em produção defina SPRING_PROFILES_ACTIVE=prd.
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financas}
    username: ${DB_USER:financas}
    password: ${DB_PASSWORD:financas}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    # apenas migrations estruturais na base; o seed entra por perfil (dev/hmlg)
    locations: classpath:db/migration
    # ignora o V5 (seed) que ja foi aplicado em ambientes antigos e nao existe mais na base
    ignore-migration-patterns: "*:missing"

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-change-me-in-production-change-me}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:1209600000}
