services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financas
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-financas}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financas -d financas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/financas
      DB_USER: financas
      DB_PASSWORD: ${DB_PASSWORD:-financas}
      SERVER_PORT: 8080
      # dev por padrão (carrega o seed). Em produção: SPRING_PROFILES_ACTIVE=prd no .env
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # em prd, o app recusa subir se este segredo for o default (ver ProductionSecurityGuard)
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-change-me-in-production-change-me}
    ports:
      - "9091:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "9090:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
